<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Mistral</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header { padding: 1rem; text-align: center; border-bottom: 1px solid #26292f; }
    #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { max-width: 75%; padding: 0.6rem 0.9rem; border-radius: 12px; white-space: pre-wrap; line-height: 1.4; }
    .user { align-self: flex-end; background: #2f6fed; color: #fff; border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: #26292f; border-bottom-left-radius: 4px; }
    .error { align-self: center; color: #ff6b6b; font-size: 0.9rem; }
    form { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid #26292f; }
    input {
      flex: 1; padding: 0.7rem 1rem; border-radius: 8px; border: 1px solid #3a3f47;
      background: #1a1d23; color: #e6e6e6; font-size: 1rem; outline: none;
    }
    button {
      padding: 0.7rem 1.4rem; border: none; border-radius: 8px;
      background: #2f6fed; color: #fff; font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header><h1>Chat Mistral</h1></header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Votre message…" autocomplete="off" required />
    <button type="submit">Envoyer</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const button = form.querySelector("button");
    const history = [];

    function addBubble(text, className) {
      const div = document.createElement("div");
      div.className = "msg " + className;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      button.disabled = true;
      addBubble(text, "user");
      history.push({ role: "user", content: text });

      const pending = addBubble("…", "assistant");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur serveur");
        pending.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.remove();
        addBubble(err.message, "error");
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
